name: Android debug APK

# Builds an UNSIGNED debug APK for internal testing only. No signing keys, no Play Console.
# Also runs on PRs that touch the Android build, so breakage is caught before merge.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Build web and sync into Android project
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: skolintegratoren-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
