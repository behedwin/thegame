name: Auto PR

# Workers never open PRs themselves. When a worker (or the idea intake) pushes a commit whose message
# contains [ready] to claude/task-<id> or claude/idea-<slug>, this workflow opens (or updates) the PR:
# title from the task file, body from the journal file, label automerge (S/M),
# needs-review (L), conflict ([conflict] in the message) or blocked (status blocked).
# Idea branches get automerge only if the diff touches nothing but tasks/, else needs-review.
# Uses AUTOMERGE_TOKEN so the new PR triggers CI and automerge.yml.

on:
  push:
    branches: ['claude/task-*', 'claude/idea-*']

permissions:
  contents: read

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: ${{ !github.event.deleted && contains(github.event.head_commit.message, '[ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update PR (idempotent)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/auto-pr.sh
