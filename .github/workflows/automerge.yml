name: Automerge

# PRs labelled "automerge" are squash-merged as soon as all required checks are green.
# Uses GitHub's native auto-merge, so it needs branch protection with required checks
# and "Allow auto-merge" in the repo settings (see README, "Parallella workers").
#
# Token: secrets.AUTOMERGE_TOKEN (fine-grained PAT) if set, otherwise GITHUB_TOKEN.
# With GITHUB_TOKEN, merges and branch updates do NOT trigger new workflow runs
# (no CI on updated branches, no APK/Pages build after merge). See README.

on:
  pull_request_target:
    types: [labeled, unlabeled, opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  enable:
    # Never checks out PR code: safe under pull_request_target.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          CHANGED_LABEL: ${{ github.event.label.name }}
          HAS_AUTOMERGE: ${{ contains(github.event.pull_request.labels.*.name, 'automerge') }}
          HAS_STOP: ${{ contains(github.event.pull_request.labels.*.name, 'conflict') || contains(github.event.pull_request.labels.*.name, 'blocked') }}
        run: |
          # Only touch auto-merge for PRs managed by labels. PRs without the label are left
          # alone, so an owner can still enable auto-merge by hand.
          if [ "$HAS_STOP" = "true" ]; then
            gh pr merge --disable-auto "$PR" 2>/dev/null || true
          elif [ "$HAS_AUTOMERGE" = "true" ]; then
            gh pr merge --auto --squash "$PR"
          elif [ "$ACTION" = "unlabeled" ] && [ "$CHANGED_LABEL" = "automerge" ]; then
            gh pr merge --disable-auto "$PR" 2>/dev/null || true
          else
            echo "No automerge label: leaving auto-merge as it is."
          fi

  unstick:
    # Keeps automerge PRs from getting stuck: updates PRs that are behind main, re-enables auto-merge
    # that got switched off, and warns about PRs whose checks fail. Runs after every push to main,
    # every 15 minutes as a safety net, and on demand. Logic: scripts/unstick-prs.mjs (+ pr-lib.mjs).
    # "Behind" comes from the compare API, NOT mergeStateStatus: right after a merge GitHub reports
    # UNKNOWN for the other PRs, so a BEHIND filter skipped them and they sat green-but-behind (#21).
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unstick automerge PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: node scripts/unstick-prs.mjs
